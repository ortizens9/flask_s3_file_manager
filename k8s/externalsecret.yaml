apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flask-secret
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-parameterstore
    kind: SecretStore
  target:
    name: flask-credenciales
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: /flask-s3/AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: /flask-s3/AWS_SECRET_ACCESS_KEY

