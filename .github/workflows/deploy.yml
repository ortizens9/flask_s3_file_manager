name: CI/CD pipeline con AWS

#Lineas que describen cuándo saltar
on:
  push:
    branches:
      - main
      - feature/*
  pull_request:
    branches:
      - main
#¿Qué tienen que hacer?
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Un saludo de prueba
        run: echo "Hola desde Github Actions!"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Instalación de dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ejecutar tests
        run: pytest
